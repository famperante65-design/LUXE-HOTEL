<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a101d"/><stop offset=".6" stop-color="#14213a"/><stop offset="1" stop-color="#0c1424"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".12" r=".7"><stop offset="0" stop-color="#e8c77a" stop-opacity=".38"/><stop offset=".5" stop-color="#c8a45a" stop-opacity=".10"/><stop offset="1" stop-color="#c8a45a" stop-opacity="0"/></radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3f66"/><stop offset="1" stop-color="#0f1a2e"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2744"/><stop offset="1" stop-color="#070b14"/></linearGradient>
    <g id="arch"><path d="M0 330V120a95 95 0 0 1 190 0V330Z"/></g>
    <g id="city" fill="#0b1426"><rect x="8" y="250" width="22" height="80"/><rect x="34" y="215" width="26" height="115"/><rect x="64" y="262" width="20" height="68"/><rect x="88" y="230" width="30" height="100"/><rect x="122" y="268" width="22" height="62"/><rect x="148" y="240" width="28" height="90"/></g>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- six arched windows with night skyline -->
  <g transform="translate(80 150)">
    <g id="win1">
      <use href="#arch" fill="url(#win)" stroke="#c8a45a" stroke-opacity=".55" stroke-width="3"/>
      <use href="#city"/>
      <path d="M95 25V330M0 190H190" stroke="#c8a45a" stroke-opacity=".35" stroke-width="2"/>
      <g fill="#f1d58f" opacity=".75"><rect x="42" y="262" width="3" height="3"/><rect x="48" y="285" width="3" height="3"/><rect x="100" y="250" width="3" height="3"/><rect x="108" y="290" width="3" height="3"/><rect x="156" y="270" width="3" height="3"/></g>
    </g>
    <use href="#win1" x="245"/><use href="#win1" x="490"/><use href="#win1" x="735"/><use href="#win1" x="980"/><use href="#win1" x="1225"/>
  </g>
  <!-- pilasters + gold trim -->
  <g stroke="#c8a45a" stroke-opacity=".28" stroke-width="2" fill="none"><path d="M40 0V560M1560 0V560M0 560H1600"/><path d="M0 120H1600" stroke-opacity=".15"/></g>
  <!-- pendant lights -->
  <g stroke="#c8a45a" stroke-opacity=".5"><path d="M400 0V90M800 0V70M1200 0V90"/></g>
  <g fill="#f1d58f"><circle cx="400" cy="96" r="9" opacity=".9"/><circle cx="800" cy="76" r="12" opacity=".95"/><circle cx="1200" cy="96" r="9" opacity=".9"/></g>
  <g fill="#e8c77a" opacity=".14"><circle cx="400" cy="96" r="60"/><circle cx="800" cy="76" r="85"/><circle cx="1200" cy="96" r="60"/></g>
  <!-- marble floor with reflections -->
  <rect y="560" width="1600" height="340" fill="url(#floor)"/>
  <g stroke="#c8a45a" stroke-opacity=".12"><path d="M0 640H1600M0 740H1600M0 860H1600"/><path d="M800 560L300 900M800 560L800 900M800 560L1300 900M800 560L-100 900M800 560L1700 900"/></g>
  <ellipse cx="800" cy="640" rx="520" ry="46" fill="#e8c77a" opacity=".07"/>
</svg>
